<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="410" viewBox="0 0 1280 410" role="img" aria-labelledby="title description">
  <title id="title">Codex on Steroids</title>
  <desc id="description">A project-aware engineering workflow connecting context, graph investigation, implementation, independent review and resumable jobs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2c"/>
      <stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#264856" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#264856" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8999b5" stroke-opacity="0.06"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57dcc2"/>
      <stop offset="1" stop-color="#9d94f4"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="410" rx="18" fill="url(#background)"/>
  <rect width="1280" height="410" rx="18" fill="url(#grid)"/>
  <ellipse cx="1010" cy="190" rx="330" ry="280" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="68" fill="#66ddc6" font-size="14" font-weight="700" letter-spacing="2.5">THE PORTABLE ENGINEERING TOOLKIT</text>
    <text x="58" y="145" fill="#f4f7ff" font-size="57" font-weight="700" letter-spacing="-1.8">Codex on Steroids</text>
    <text x="60" y="196" fill="#c3cede" font-size="24">Understand. Build. Verify.</text>
    <text x="60" y="230" fill="#94a5bc" font-size="18">Project context, specialist roles and a reviewable trail.</text>
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="60" y="295" width="137" height="38" rx="19" fill="#20342f" stroke="#4b8f7f"/>
