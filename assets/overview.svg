      <path d="M 785 106 L 785 99 L 807 99 L 807 121 L 785 121 L 785 114 M 780 110 L 794 110" fill="none" stroke="#a4f0dd" stroke-width="2" stroke-linecap="round"/>
      <text x="796" y="157" fill="#c3cede">Context</text>
