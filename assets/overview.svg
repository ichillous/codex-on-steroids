      <rect x="326" y="295" width="116" height="38" rx="19" fill="#2a2940" stroke="#68618d"/>
      <text x="384" y="319" fill="#d0c7ff">LangGraph</text>
      <rect x="454" y="295" width="135" height="38" rx="19" fill="#2a2940" stroke="#68618d"/>
      <text x="521.5" y="319" fill="#d0c7ff">AutoGen lab</text>
    </g>
    <g fill="none" stroke-width="2">
