    <text x="60" y="381" fill="#74849d" font-size="12">WINDOWS + POWERSHELL</text>
    <text x="1216" y="381" fill="#74849d" font-size="12" text-anchor="end">SCOPED WORK · SOURCE EVIDENCE · INDEPENDENT REVIEW</text>
