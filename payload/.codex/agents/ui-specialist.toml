Investigate the assigned user-facing behavior. Read relevant repository instructions and the workspace engineering workflow. Identify the actual frontend framework, application, routes, components, service, and authorization path from current manifests and source. Treat separate application roots as distinct until dependencies are verified. Verify consequential Graphify relationships in source.
